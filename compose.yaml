version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: prism-postgres
    environment:
      POSTGRES_DB: prism
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prism_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prism-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: prism-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
      KC_DB: postgres
      KC_DB_URL_DATABASE: prism
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_USERNAME: prism
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-prism_dev_password}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - prism-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prism-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://prism:${POSTGRES_PASSWORD:-prism_dev_password}@postgres:5432/prism
      DATABASE_ECHO: "false"
      DEBUG: "true"
      DEMO_MODE: "true"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-for-testing-only-32-chars-minimum}
      OIDC_ENABLED: "true"
      OIDC_ISSUER_URL: http://keycloak:8080/realms/prism
      OIDC_CLIENT_ID: prism-workbench
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      SESSION_COOKIE_SECURE: "false"
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./backend/app:/app/app:ro
      - prism_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - prism-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prism-frontend
    environment:
      VITE_API_URL: /api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - prism-network

volumes:
  postgres_data:
  prism_data:

networks:
  prism-network:
    driver: bridge